name: my_campus_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  equatable: ^3.0.0
  fpdart: ^1.2.0
  get_it: ^9.3.0
  go_router: ^18.0.2
  google_fonts: ^9.0.0
  flutter_screenutil: ^5.9.3
  flutter_bloc: ^9.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  icons_launcher: ^3.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/

icons_launcher:
  image_path: "assets/icons/mycampus_logo.png"
  platforms:
    android:
      enable: true
      image_path: "assets/icons/mycampus_logo.png"
      adaptive_background_color: "#ffffff"
      adaptive_foreground_image: "assets/icons/mycampus_logo.png"
    ios:
      enable: true
      image_path: "assets/icons/mycampus_logo.png"
